<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bergen Hub | Live. Study. Belong.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #142b3b;
      --navy-light: #1e3f56;
      --fjord: #2b6cb0;
      --bg: #f4f7f9;
      --surface: #ffffff;
      --text: #1a2935;
      --muted: #5c7080;
      --border: #e2e8f0;
      --card-blue: #eef5f9;
      --card-green: #edf7f3;
      --card-purple: #f3effa;
      --card-pink: #fdf0f1;
      --card-amber: #fef8eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    /* Navigation Bar */
    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-inner {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--navy);
    }
    .logo-icon {
      width: 34px;
      height: 34px;
      background: var(--navy);
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .logo-text strong { display: block; font-size: 1.05rem; line-height: 1.1; }
    .logo-text span { font-size: 0.72rem; color: var(--muted); font-weight: 500; }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.15s;
    }
    .nav-links a:hover { color: var(--fjord); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .lang-toggle {
      display: flex;
      background: var(--bg);
      border-radius: 6px;
      padding: 2px;
      border: 1px solid var(--border);
    }
    .lang-btn {
      border: none;
      background: transparent;
      padding: 0.25rem 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      color: var(--muted);
    }
    .lang-btn.active {
      background: var(--surface);
      color: var(--navy);
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    .ask-btn {
      background: var(--navy);
      color: white;
      border: none;
      padding: 0.5rem 0.95rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.15s;
    }
    .ask-btn:hover { background: var(--navy-light); }

    /* Hero Section with Bryggen Background */
    .hero {
      position: relative;
      background-image: linear-gradient(90deg, rgba(244, 248, 252, 0.94) 0%, rgba(244, 248, 252, 0.78) 48%, rgba(20, 43, 59, 0.25) 100%),
                        url('https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      padding: 3.5rem 1.25rem 4rem;
      border-bottom: 1px solid var(--border);
    }
    .hero-inner {
      max-width: 1160px;
      margin: 0 auto;
      position: relative;
    }
    .welcome-sticker {
      position: absolute;
      right: 2%;
      top: -1rem;
      color: #ffffff;
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 1.45rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.65);
      transform: rotate(-8deg);
      pointer-events: none;
      text-align: center;
      line-height: 1.2;
    }
    .hero h1 {
      font-size: clamp(2rem, 4vw, 2.85rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.15;
      max-width: 560px;
      margin-bottom: 0.75rem;
    }
    .hero p {
      font-size: 1.05rem;
      color: var(--navy-light);
      max-width: 520px;
      margin-bottom: 1.6rem;
      font-weight: 500;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: var(--surface);
      border-radius: 999px;
      padding: 0.35rem 0.4rem 0.35rem 1.2rem;
      max-width: 520px;
      box-shadow: 0 8px 24px rgba(20, 43, 59, 0.12);
      border: 1px solid rgba(20, 43, 59, 0.1);
    }
    .search-box input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 0.95rem;
      color: var(--text);
      background: transparent;
    }
    .search-submit {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--navy);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    /* Main Container */
    .main {
      max-width: 1160px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3.5rem;
    }

    /* Timeline Journey Strip */
    .journey-bar {
      background: var(--surface);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin-bottom: 2rem;
    }
    .journey-intro { max-width: 210px; }
    .journey-intro strong { display: block; font-size: 0.95rem; color: var(--navy); }
    .journey-intro span { font-size: 0.82rem; color: var(--muted); }

    .journey-steps {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      justify-content: space-around;
      flex-wrap: wrap;
    }
    .step-item {
      text-align: center;
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      border-radius: 10px;
      transition: background 0.15s;
    }
    .step-item:hover { background: var(--bg); }
    .step-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--navy);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.45rem;
      font-size: 1.15rem;
    }
    .step-item:nth-child(3) .step-circle { background: #3b7ea1; }
    .step-item:nth-child(5) .step-circle { background: #2d8a68; }
    .step-item:nth-child(7) .step-circle { background: #5a4b81; }
    .step-item strong { display: block; font-size: 0.85rem; color: var(--navy); }
    .step-item span { font-size: 0.75rem; color: var(--muted); }
    .step-arrow { color: #cbd5e1; font-weight: bold; }

    .outline-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.55rem 1rem;
      border-radius: 999px;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--navy);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .outline-btn:hover { border-color: var(--navy); background: var(--bg); }

    /* Grid Layout: Categories + Popular Questions */
    .qa-layout {
      display: grid;
      grid-template-columns: 1fr 290px;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.85rem;
    }
    .cat-card {
      background: var(--card-blue);
      border-radius: 14px;
      padding: 1.15rem 0.75rem;
      text-align: center;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.04);
      transition: transform 0.18s, box-shadow 0.18s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 122px;
    }
    .cat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(20, 43, 59, 0.08);
    }
    .cat-card.green { background: var(--card-green); }
    .cat-card.purple { background: var(--card-purple); }
    .cat-card.pink { background: var(--card-pink); }
    .cat-card.amber { background: var(--card-amber); }

    .cat-icon { font-size: 1.5rem; margin-bottom: 0.45rem; }
    .cat-title { font-size: 0.83rem; font-weight: 600; color: var(--navy); line-height: 1.3; }
    .cat-arrow { font-size: 0.8rem; color: var(--muted); margin-top: 0.35rem; }

    /* Popular Questions Sidebar */
    .popular-box {
      background: var(--card-amber);
      border-radius: 16px;
      padding: 1.25rem;
      border: 1px solid #f5e6c4;
    }
    .popular-box h3 {
      font-size: 1rem;
      color: var(--navy);
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .pq-list { list-style: none; }
    .pq-item {
      padding: 0.65rem 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }
    .pq-item:last-child { border-bottom: none; padding-bottom: 0; }
    .pq-item:hover { color: var(--fjord); }

    /* Bottom 3-Column Section */
    .bottom-grid {
      display: grid;
      grid-template-columns: 280px 1fr 260px;
      gap: 1.25rem;
    }
