<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bergen Hub | Live. Study. Belong.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #142b3b;
      --navy-light: #1e3f56;
      --fjord: #2b6cb0;
      --bg: #f4f7f9;
      --surface: #ffffff;
      --text: #1a2935;
      --muted: #5c7080;
      --border: #e2e8f0;
      --card-blue: #eef5f9;
      --card-green: #edf7f3;
      --card-purple: #f3effa;
      --card-pink: #fdf0f1;
      --card-amber: #fef8eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    /* Navigation Bar */
    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-inner {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--navy);
    }
    .logo-icon {
      width: 34px;
      height: 34px;
      background: var(--navy);
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .logo-text strong { display: block; font-size: 1.05rem; line-height: 1.1; }
    .logo-text span { font-size: 0.72rem; color: var(--muted); font-weight: 500; }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.15s;
    }
    .nav-links a:hover { color: var(--fjord); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .lang-toggle {
      display: flex;
      background: var(--bg);
      border-radius: 6px;
      padding: 2px;
      border: 1px solid var(--border);
    }
    .lang-btn {
      border: none;
      background: transparent;
      padding: 0.25rem 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      color: var(--muted);
    }
    .lang-btn.active {
      background: var(--surface);
      color: var(--navy);
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    .ask-btn {
      background: var(--navy);
      color: white;
      border: none;
      padding: 0.5rem 0.95rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.15s;
    }
    .ask-btn:hover { background: var(--navy-light); }

    /* Hero Section with Bryggen Background */
    .hero {
      position: relative;
      background-image: linear-gradient(90deg, rgba(244, 248, 252, 0.94) 0%, rgba(244, 248, 252, 0.78) 48%, rgba(20, 43, 59, 0.25) 100%),
                        url('https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      padding: 3.5rem 1.25rem 4rem;
      border-bottom: 1px solid var(--border);
    }
    .hero-inner {
      max-width: 1160px;
      margin: 0 auto;
      position: relative;
    }
    .welcome-sticker {
      position: absolute;
      right: 2%;
      top: -1rem;
      color: #ffffff;
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 1.45rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.65);
      transform: rotate(-8deg);
      pointer-events: none;
      text-align: center;
      line-height: 1.2;
